<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local time</title>
    <script type="module" src="time.js"></script>
    <style>
        body{
            background-color: black;
            color: white;
        }
        .center{
            display: flex;
            height: 100vh;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #clock{
            background-color: cyan;
            text-align: center;
            font-size: 20px;
            padding: 10px 20px;
            margin-top: 20px;
            border-radius: 20px;
            color: black;
            
        }
        span{
            font-size: 22px;
            font-weight: 700;
            color: deeppink;
            font-family: Georgia, 'Times New Roman', Times, serif;
        }
    </style>
</head>
<body>
    <div class="center">
        <div id="banner"><span>Your Local Time</span></div>
        <div id="clock"></div>
    </div>
</body>
</html>
